name: Live functional smoke
# Includes production PWA offline navigation, manifest, and cache-fallback verification with an uncached route and offline HTTP error handling.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/live-smoke.mjs"
      - "tools/live-pwa-smoke.mjs"
      - "sw.js"
      - "build_models.py"
      - "manifest.json"
      - "offline.html"
      - "index.html"
      - "ride-match.html"
      - "site.js"
      - "model_data_v2.json"
      - ".github/workflows/live-functional-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Calculator and Ride Match browser flows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIVE: https://voltride-4qj.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install chromium
      - name: Exercise live calculator and Ride Match
        run: node tools/live-smoke.mjs "$LIVE"
      - name: Resolve Cloudflare Pages preview URL
        run: |
          if [ -n "$GITHUB_HEAD_REF" ]; then
            slug="$(printf '%s' "$GITHUB_HEAD_REF" | sed 's#/#-#g' | tr '[:upper:]' '[:lower:]' | cut -c1-28)"
            echo "PREVIEW=https://${slug}.voltride-4qj.pages.dev" >> "$GITHUB_ENV"
          else
            echo "PREVIEW=$LIVE" >> "$GITHUB_ENV"
          fi
      - name: Wait for Cloudflare to deploy this exact service worker
        run: |
          expected="$(sha256sum sw.js | awk '{print $1}')"
          echo "Expected service worker SHA-256: $expected"
          for i in $(seq 1 30); do
            actual="$(curl -fsS "$PREVIEW/sw.js?cb=$RANDOM" | sha256sum | awk '{print $1}' || true)"
            echo "Preview attempt $i SHA-256: $actual"
            if [ -n "$actual" ] && [ "$actual" = "$expected" ]; then
              echo "Cloudflare preview matches the checked-out service worker."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Cloudflare preview did not publish the checked-out sw.js within 10 minutes"
          exit 1
      - name: Verify production PWA and offline behavior
        run: node tools/live-pwa-smoke.mjs "$PREVIEW"
