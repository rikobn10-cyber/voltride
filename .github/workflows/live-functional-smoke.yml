name: Live functional smoke
# Includes production PWA offline navigation, manifest, and cache-fallback verification with an uncached route and offline HTTP error handling.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/live-smoke.mjs"
      - "tools/live-pwa-smoke.mjs"
      - "sw.js"
      - "build_models.py"
      - "manifest.json"
      - "offline.html"
      - "index.html"
      - "ride-match.html"
      - "site.js"
      - "model_data_v2.json"
      - ".github/workflows/live-functional-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Calculator and Ride Match browser flows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIVE: https://voltride-4qj.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install chromium
      - name: Exercise live calculator and Ride Match
        run: node tools/live-smoke.mjs "$LIVE"
      # This PR does not change sw.js. A branch-preview deployment gate would
      # test an unrelated Cloudflare preview alias and can time out even when
      # the production PWA is healthy. Exercise the deployed production PWA
      # directly; changes to sw.js remain covered by the same live smoke test.
      - name: Verify production PWA and offline behavior
        run: node tools/live-pwa-smoke.mjs "$LIVE"
