name: Site checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Internal links, canonicals, hreflang, sitemap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_links.py

  generated:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-run the generator and fail if it changes anything
        run: |
          python3 build_models.py
          git diff --stat --exit-code || (echo "::error::build_models.py changes committed files. Commit the regenerated output (or edit build_models.py instead of the generated pages)." && exit 1)

  a11y:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install axe + Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0 @axe-core/playwright@4
          npx playwright install --with-deps chromium
      - name: Serve the site and run axe
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2
          node tools/a11y.mjs http://localhost:8080
      - name: Post the report on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('a11y-report.md')) return;
            const body = fs.readFileSync('a11y-report.md', 'utf8').slice(0, 60000);
            const marker = '<!-- a11y-report -->';
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const old = comments.find(c => c.body && c.body.includes(marker));
            const payload = { ...context.repo, body: marker + '\n' + body };
            if (old) await github.rest.issues.updateComment({ ...payload, comment_id: old.id });
            else await github.rest.issues.createComment({ ...payload, issue_number: context.issue.number });
